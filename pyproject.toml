[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast"
version = "0.1.0"
description = "Load and solar forecasting with battery dispatch for commercial buildings and microgrids"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
    "holidays>=0.45",
    "typer>=0.12",
]

[project.optional-dependencies]
models = [
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]
deep = ["torch>=2.2"]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mlflow>=2.12",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
gridcast = "gridcast.cli:app"

[tool.setuptools.packages.find]
include = ["gridcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
