services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: gridcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridcast}
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridcast -d mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: >
      sh -c "pip install --quiet psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://gridcast:${POSTGRES_PASSWORD:-gridcast}@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "5000:5000"

  api:
    build: .
    env_file: .env.example
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GRIDCAST_DATA_DIR: /data
      GRIDCAST_ARTIFACT_DIR: /artifacts
      GRIDCAST_RESULTS_DIR: /app/results
    volumes:
      - ./data:/data
      - artifacts:/artifacts
      - ./results:/app/results:ro
    depends_on:
      - mlflow
    ports:
      - "8000:8000"

  scheduler:
    build: .
    command: ["gridcast", "schedule"]
    env_file: .env.example
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GRIDCAST_DATA_DIR: /data
      GRIDCAST_ARTIFACT_DIR: /artifacts
    volumes:
      - ./data:/data
      - artifacts:/artifacts
    depends_on:
      - mlflow

  dashboard:
    image: nginx:1.27-alpine
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  mlartifacts:
  artifacts:
